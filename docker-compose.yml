services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-halcyon}
      POSTGRES_USER: ${POSTGRES_USER:-halcyon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-halcyon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    # The Dockerfile defaults to prod settings for a real deploy; locally we
    # want dev (no SSL-redirect/secure-cookie requirements) since compose
    # serves plain HTTP, while still testing against real Postgres.
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-halcyon}:${POSTGRES_PASSWORD:-halcyon}@db:5432/${POSTGRES_DB:-halcyon}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
